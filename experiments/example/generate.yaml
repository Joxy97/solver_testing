# Edit these values to define your Random QUBO experiment.
output_folder: ./
base_seed: 42

problems:
  - type: random_qubo
    count: 20
    batch_name: RQ_1
    parameters:
      num_variables: 1000
      quadratic_density: 0.01
      distribution: uniform
  
  - type: random_qubo
    count: 20
    batch_name: RQ_10
    parameters:
      num_variables: 1000
      quadratic_density: 0.1
      distribution: uniform

  - type: random_qubo
    count: 20
    batch_name: RQ_50
    parameters:
      num_variables: 1000
      quadratic_density: 0.5
      distribution: uniform

  - type: random_qubo
    count: 20
    batch_name: RQ_90
    parameters:
      num_variables: 1000
      quadratic_density: 0.9
      distribution: uniform

  - type: random_qubo
    count: 20
    batch_name: RQ_100
    parameters:
      num_variables: 1000
      quadratic_density: 1
      distribution: uniform