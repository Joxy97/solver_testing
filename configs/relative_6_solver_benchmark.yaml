# Optional overrides for benchmark_6_solvers.py.
# Omitted parameters retain the corresponding solver adapter defaults.
solvers:
  scipy_highs:
    max_quadratic_terms: 500000
    max_linearized_variables: 501000
    presolve: false
  ocean_sa: {}
  bifurcation_cpu:
    device: cpu
  bifurcation_cuda:
    device: cuda
  transverse_route_cpu:
    device: cpu
  transverse_route_cuda:
    device: cuda
