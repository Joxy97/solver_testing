# Each entry runs every generated instance once. Add, remove, or copy entries as needed.
problem_files:
  - ../generated_problems/random_qubo/*.json
output_folder: ../BenchmarkResults/random_qubo
continue_on_error: true

solvers:
  - type: ocean_sa
    parameters:
      num_reads: 100
      num_sweeps: 1000
      seed: 42

  - type: simulated_bifurcation
    parameters:
      device: cuda:0
      agents: 128
      max_steps: 10000
      timeout: 60
      seed: 42

  - type: transverse_route
    parameters:
      device: cuda:1
      agents: 64
      max_steps: 1000
      seed: 42
